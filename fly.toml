# fly.toml — God's Eye View
# Deploy: fly launch --copy-config --yes && fly secrets set GOOGLE_MAPS_API_KEY=... && fly deploy

app = "gods-eye-view"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Set via `fly deploy --build-arg GOOGLE_MAPS_API_KEY=...` or fly.toml [build.args]
  # GOOGLE_MAPS_API_KEY is also needed at runtime for server-side Places proxies.

[env]
  HOST = "0.0.0.0"
  PORT = "4173"
  OPENSKY_AUTH_MODE = "anon"
  NODE_ENV = "production"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
